<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>离线博客</title><style>
:root{--accent:#335c49;--bg:#f6f3ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#252b28;font:16px/1.75 system-ui,'Microsoft YaHei',sans-serif}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid #d8ddd7;border-radius:8px;padding:8px 16px;background:#fff;color:var(--accent)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button.danger{color:#ad3030}button:disabled{opacity:.5;cursor:wait}a{color:var(--accent)}header{border-bottom:1px solid #dce0d8;padding:32px max(24px,calc((100vw - 1120px)/2));background:#ffffffa8}header .top{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--accent)}h1{font-size:36px;line-height:1.3;margin:12px 0}h2{line-height:1.4;margin:0 0 18px}h3{margin:0 0 12px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}nav button{background:transparent}nav button.active{background:var(--accent);color:white}main{max-width:1120px;margin:36px auto;padding:0 24px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}.muted{color:#69736b;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:20px}.card,.panel{background:#fff;border:1px solid #e0e4dc;border-radius:14px;padding:25px;overflow:hidden}.card{cursor:pointer;transition:transform .15s}.card:hover{transform:translateY(-3px)}.card img{width:100%;height:180px;object-fit:cover;border-radius:8px;margin-bottom:15px}.card p{white-space:pre-wrap;overflow-wrap:anywhere}.badge{font-size:12px;padding:3px 8px;background:#edf2e9;color:var(--accent);border-radius:5px}.empty{text-align:center;padding:70px 20px;border:1px dashed #bcc7b8;border-radius:14px}.article{max-width:820px;margin:auto}.article .body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;margin:30px 0}.attachments img,.attachments video{display:block;max-width:100%;max-height:700px;margin:15px auto;border-radius:10px}.attachments audio{width:100%}.attachment{border-top:1px solid #e4e8e1;padding:18px 0}.media-card img,.media-card video{width:100%;height:180px;object-fit:contain;background:#f3f4ef}.media-card .name{overflow-wrap:anywhere;font-size:14px;margin:10px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.split{display:grid;grid-template-columns:1.7fr 1fr;gap:24px}label{display:block;margin:15px 0 6px;font-size:14px;color:#526052}input:not([type=checkbox]):not([type=color]),textarea,select{width:100%;border:1px solid #cdd5cb;background:#fff;border-radius:7px;padding:10px;color:#252b28}textarea{resize:vertical;min-height:100px}input[type=checkbox]{width:18px;height:18px}input[type=color]{height:40px;width:70px}.editor{min-height:360px}.listrow{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid #e1e5de}.listrow .name{flex:1;overflow-wrap:anywhere}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#263d30;color:#fff;padding:12px 24px;border-radius:9px;box-shadow:0 6px 30px #0002;max-width:90vw;z-index:100}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}.tabs button.active{background:var(--accent);color:#fff}.help{font-size:13px;color:#69736b}footer{max-width:1120px;margin:50px auto;padding:24px;border-top:1px solid #dce0d8;font-size:13px;color:#69736b}.month{margin:28px 0 12px}.attachment-choice{display:flex;gap:12px;align-items:center;padding:8px;border-bottom:1px solid #eee}.attachment-choice label{margin:0;overflow-wrap:anywhere}.back{margin-bottom:20px}@media(max-width:720px){.split{grid-template-columns:1fr}h1{font-size:29px}header{padding:24px}main{margin-top:24px}.panel{padding:20px}.top{align-items:flex-start!important}}
</style><header><div class="top"><div><div class="eyebrow">LOCAL JOURNAL · 离线私人空间</div><h1 id="site-title"></h1><div id="subtitle" class="muted"></div></div><button id="admin-button" onclick="adminEntry()">管理后台</button></div><nav id="nav"></nav></header><main id="main"></main><footer>本地存储 · 无需联网 · 所有文章与媒体保存在本文件夹内。迁移前请先关闭博客程序。</footer><div id="toast" class="toast" hidden role="status"></div>
<script>
let state,view='home',adminTab='posts',editId=null,dirty=false;const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
async function api(path,data){const r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json','X-Blog-Request':'1'},body:data===undefined?undefined:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j}
async function refresh(){state=await api('state');const s=state.settings;document.title=s.title;$('#site-title').textContent=s.title;$('#subtitle').textContent=s.subtitle;document.documentElement.style.setProperty('--accent',s.accent);document.documentElement.style.setProperty('--bg',s.background);$('#admin-button').textContent=state.admin?'进入后台':'管理后台';$('#nav').innerHTML=s.menus.map(m=>`<button class="${view===m.target?'active':''}" data-view="${esc(m.target)}">${esc(m.label)}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.view));}
async function go(v){if(dirty&&!confirm('尚有未保存内容，确定离开？'))return;dirty=false;view=v;await refresh();if(v==='admin')renderAdmin();else renderPublic();window.scrollTo(0,0)}
function mediaHTML(m){const u='/media/'+m.id;if(m.type.startsWith('image/'))return `<img loading="lazy" src="${u}" alt="${esc(m.name)}">`;if(m.type.startsWith('video/'))return `<video controls preload="metadata" src="${u}"></video>`;if(m.type.startsWith('audio/'))return `<audio controls preload="metadata" src="${u}"></audio>`;return '<div style="padding:35px;text-align:center">📄 文件</div>'}
function published(){return state.posts.filter(p=>p.status==='published')}
function renderPublic(){const m=$('#main');if(view==='media'){m.innerHTML='<div class="toolbar"><h2>媒体收藏</h2><span class="muted">已发布文章的图片、视频与文件</span></div><div class="grid">'+state.media.filter(x=>published().some(p=>p.attachments.includes(x.id))).map(x=>`<div class="panel media-card">${mediaHTML(x)}<div class="name">${esc(x.name)}</div><a href="/media/${x.id}" download="${esc(x.name)}">保存文件</a></div>`).join('')+'</div>';return}
let posts=published();const cat=view.startsWith('category:')?view.slice(9):'';if(cat)posts=posts.filter(p=>p.category===cat);m.innerHTML=`<div class="toolbar"><h2>${view==='archive'?'文章归档':cat?esc(cat):'最新记录'}</h2><input id="search" aria-label="搜索文章" placeholder="搜索标题与正文…" style="max-width:300px"></div><div id="posts"></div>`;function results(){const q=$('#search').value.toLowerCase();const ps=posts.filter(p=>(p.title+' '+p.body).toLowerCase().includes(q));let last='';$('#posts').innerHTML=ps.length?(view==='archive'?ps.map(p=>{const month=p.created.slice(0,7);const heading=last!==month?`<h3 class="month">${month.replace('-',' 年 ')} 月</h3>`:'';last=month;return heading+`<div class="listrow"><button data-post="${p.id}">${esc(p.title)}</button><span class="muted">${p.created.slice(0,10)} · ${esc(p.category||'未分类')}</span></div>`}).join(''):'<div class="grid">'+ps.map(p=>{const cover=state.media.find(x=>p.attachments.includes(x.id)&&x.type.startsWith('image/'));return `<article class="card" tabindex="0" data-post="${p.id}">${cover?`<img src="/media/${cover.id}" alt="">`:''}<div class="muted">${p.created.slice(0,10)} · ${esc(p.category||'未分类')}</div><h3>${esc(p.title)}</h3><p>${esc(p.body.slice(0,140))}${p.body.length>140?'…':''}</p><span class="badge">${p.attachments.length} 个附件</span></article>`}).join('')+'</div>'):'<div class="empty">暂无文章。进入管理后台，写下第一篇记录。</div>';$('#posts').querySelectorAll('[data-post]').forEach(b=>{b.onclick=()=>article(b.dataset.post);b.onkeydown=e=>{if(e.key==='Enter')article(b.dataset.post)}})}$('#search').oninput=results;results()}
function article(id){const p=state.posts.find(x=>x.id===id);$('#main').innerHTML=`<div class="article"><button class="back" onclick="go(view)">← 返回列表</button><div class="panel"><div class="muted">${esc(p.category||'未分类')} · ${p.created} ${p.status==='draft'?'· 草稿预览':''}</div><h1>${esc(p.title)}</h1><div class="body">${esc(p.body)}</div><div class="attachments">${p.attachments.map(id=>state.media.find(m=>m.id===id)).filter(Boolean).map(m=>`<div class="attachment">${mediaHTML(m)}<div class="muted">${esc(m.name)} · <a href="/media/${m.id}" download="${esc(m.name)}">下载原文件</a></div></div>`).join('')}</div></div></div>`;window.scrollTo(0,0)}
function adminEntry(){if(state.admin)return go('admin');view='login';$('#main').innerHTML=`<div class="panel" style="max-width:440px;margin:auto"><h2>${state.needs_setup?'设置后台密码':'登录管理后台'}</h2><p class="muted">${state.needs_setup?'首次使用，请设置至少 8 位密码。密码随数据文件夹迁移。':'管理文章、媒体与博客设置。'}</p><form id="login"><label for="password">后台密码</label><input id="password" type="password" minlength="8" maxlength="256" required autocomplete="${state.needs_setup?'new-password':'current-password'}">${state.needs_setup?'<label for="confirm">再次输入密码</label><input id="confirm" type="password" required autocomplete="new-password">':''}<button class="primary" style="margin-top:20px">${state.needs_setup?'创建并进入':'登录'}</button></form><p class="help">仅限本机访问。后台密码用于管理入口，数据文件本身未加密。</p></div>`;$('#login').onsubmit=async e=>{e.preventDefault();const password=$('#password').value;if($('#confirm')&&$('#confirm').value!==password)return notice('两次密码不一致');try{await api(state.needs_setup?'setup':'login',{password});await go('admin')}catch(e){notice(e.message)}};$('#password').focus()}
function renderAdmin(){if(!state.admin)return adminEntry();$('#main').innerHTML=`<div class="toolbar"><h2>博客管理</h2><div class="row"><a href="/api/backup">导出数据备份</a><button onclick="logout()">退出登录</button></div></div><div class="tabs">${[['posts','文章'],['media','媒体库'],['settings','类目 / 菜单 / 界面'],['security','密码与迁移']].map(([id,label])=>`<button class="${adminTab===id?'active':''}" onclick="tab('${id}')">${label}</button>`).join('')}</div><div id="admin-content"></div>`;if(adminTab==='posts')postList();if(adminTab==='media')mediaLibrary();if(adminTab==='settings')settingsPage();if(adminTab==='security')securityPage()}
function tab(t){if(dirty&&!confirm('放弃未保存内容？'))return;dirty=false;adminTab=t;renderAdmin()}
async function logout(){if(dirty&&!confirm('放弃未保存内容并退出？'))return;await api('logout',{});dirty=false;await go('home')}
function postList(){$('#admin-content').innerHTML=`<div class="toolbar"><span class="muted">共 ${state.posts.length} 篇文章 · 草稿仅后台可见</span><button class="primary" onclick="editPost()">＋ 写文章</button></div><div class="panel">${state.posts.length?state.posts.map(p=>`<div class="listrow"><div class="name"><strong>${esc(p.title)}</strong><div class="muted">${p.updated} · ${esc(p.category||'未分类')} · ${p.status==='draft'?'草稿':'已发布'}</div></div><button onclick="article('${p.id}')">预览</button><button onclick="editPost('${p.id}')">编辑</button><button class="danger" onclick="deletePost('${p.id}')">删除</button></div>`).join(''):'还没有文章，点击“写文章”开始。'}</div>`}
function editPost(id){editId=id||null;const p=state.posts.find(x=>x.id===id)||{title:'',body:'',category:'',status:'draft',attachments:[]};$('#admin-content').innerHTML=`<form id="editor-form"><div class="toolbar"><h3>${id?'编辑文章':'新文章'}</h3><div class="row"><button type="button" onclick="tab('posts')">返回</button><button class="primary" type="submit">保存文章</button></div></div><div class="split"><div class="panel"><label>标题<input id="post-title" required maxlength="200" value="${esc(p.title)}"></label><label>正文（纯文本，保留换行）<textarea class="editor" id="post-body">${esc(p.body)}</textarea></label><p class="help">图片、视频作为文章附件显示在正文下方，支持原文件下载。</p></div><div class="panel"><label>类目<select id="post-category"><option value="">未分类</option>${state.settings.categories.map(c=>`<option ${c===p.category?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>发布状态<select id="post-status"><option value="draft" ${p.status==='draft'?'selected':''}>草稿（仅后台可见）</option><option value="published" ${p.status==='published'?'selected':''}>已发布（博客可见）</option></select></label><label>上传附件<input id="post-upload" type="file" multiple></label><div id="upload-status" class="help"></div><label>选择附件</label><div id="choices" style="max-height:450px;overflow:auto"></div></div></div></form>`;let selected=new Set(p.attachments);function choices(){$('#choices').innerHTML=state.media.map(m=>`<div class="attachment-choice"><input type="checkbox" id="att-${m.id}" value="${m.id}" ${selected.has(m.id)?'checked':''}><label for="att-${m.id}">${esc(m.name)} <span class="muted">${size(m.size)}</span></label></div>`).join('')||'<span class="help">尚无附件，可在上方上传。</span>';$('#choices').onchange=e=>{e.target.checked?selected.add(e.target.value):selected.delete(e.target.value);dirty=true}}choices();$('#editor-form').oninput=()=>dirty=true;$('#post-upload').onchange=async e=>{const form=$('#editor-form');form.querySelector('button[type=submit]').disabled=true;try{await upload(e.target.files,id=>selected.add(id));await refresh();choices();dirty=true}catch(e){notice(e.message)}finally{form.querySelector('button[type=submit]').disabled=false;e.target.value=''}};$('#editor-form').onsubmit=async e=>{e.preventDefault();try{await api('post',{id:editId,title:$('#post-title').value,body:$('#post-body').value,category:$('#post-category').value,status:$('#post-status').value,attachments:[...selected]});dirty=false;await refresh();postList();notice('文章已保存')}catch(e){notice(e.message)}}}
async function deletePost(id){if(!confirm('确定删除这篇文章？附件将保留在媒体库。'))return;try{await api('delete-post',{id});await refresh();postList()}catch(e){notice(e.message)}}
function size(n){return n>=1024**2?(n/1024**2).toFixed(1)+' MB':(n/1024).toFixed(1)+' KB'}
async function upload(files,onDone){for(const f of files){if(f.size>1024**3)throw Error(f.name+' 超过 1GB');$('#upload-status').textContent='正在上传 '+f.name+'（'+size(f.size)+'）…';const r=await fetch('/api/upload',{method:'POST',headers:{'X-Blog-Request':'1','X-Filename':encodeURIComponent(f.name)},body:f});const j=await r.json();if(!r.ok)throw Error(j.error);if(onDone)onDone(j.id)}$('#upload-status').textContent='上传完成';notice('文件上传完成')}
function mediaLibrary(){$('#admin-content').innerHTML=`<div class="panel" style="margin-bottom:24px"><label>上传图片、视频、音频或 PDF / TXT<input type="file" id="library-upload" multiple></label><div id="upload-status" class="help">单个文件最大 1GB。视频能否播放取决于浏览器的编码支持，推荐 MP4（H.264/AAC）。</div><p class="help">未关联到已发布文章的文件，仅后台可见。删除正在被文章使用的文件会被阻止。</p></div><div class="grid">${state.media.map(m=>`<div class="panel media-card">${mediaHTML(m)}<div class="name">${esc(m.name)}</div><div class="muted">${size(m.size)} · ${m.created.slice(0,10)}</div><div class="row"><a href="/media/${m.id}" download="${esc(m.name)}">下载</a><button class="danger" onclick="deleteMedia('${m.id}')">删除</button></div></div>`).join('')}</div>`;$('#library-upload').onchange=async e=>{e.target.disabled=true;try{await upload(e.target.files);await refresh();mediaLibrary()}catch(err){notice(err.message);await refresh();mediaLibrary()}}}
async function deleteMedia(id){if(!confirm('永久删除此文件？建议先导出备份。'))return;try{await api('delete-media',{id});await refresh();mediaLibrary()}catch(e){notice(e.message)}}
function settingsPage(){const s=state.settings;$('#admin-content').innerHTML=`<form id="settings-form"><div class="split"><div class="panel"><h3>界面设置</h3><label>博客名称<input id="title" maxlength="300" value="${esc(s.title)}" required></label><label>副标题<input id="tagline" maxlength="300" value="${esc(s.subtitle)}"></label><div class="row"><label>主题色<input type="color" id="accent" value="${s.accent}"></label><label>背景色<input type="color" id="background" value="${s.background}"></label></div><h3 style="margin-top:28px">类目</h3><p class="help">每行一个类目，调整行序即可排序。删除类目不会删除文章，相关文章会归入“未分类”。</p><textarea id="categories">${esc(s.categories.join('\n'))}</textarea></div><div class="panel"><h3>顶部菜单</h3><p class="help">每行：菜单名称 | 目标<br>目标可用：首页、归档、媒体，或“类目:类目名称”。调整行序即可调整菜单顺序。</p><textarea id="menus" style="min-height:260px">${esc(s.menus.map(m=>m.label+' | '+({home:'首页',archive:'归档',media:'媒体'}[m.target]||m.target.replace('category:','类目:'))).join('\n'))}</textarea><button class="primary" style="margin-top:22px">保存全部设置</button></div></div></form>`;$('#settings-form').oninput=()=>dirty=true;$('#settings-form').onsubmit=async e=>{e.preventDefault();try{const categories=[...new Set($('#categories').value.split('\n').map(x=>x.trim()).filter(Boolean))];const menus=$('#menus').value.split('\n').filter(x=>x.trim()).map(line=>{const i=line.indexOf('|');if(i<0)throw Error('菜单每行需要使用 | 分隔名称与目标');const label=line.slice(0,i).trim(),t=line.slice(i+1).trim();return {label,target:({首页:'home',归档:'archive',媒体:'media'}[t]||t.replace(/^类目[:：]/,'category:'))}});await api('settings',{title:$('#title').value,subtitle:$('#tagline').value,accent:$('#accent').value,background:$('#background').value,categories,menus});dirty=false;await refresh();renderAdmin();notice('设置已保存')}catch(e){notice(e.message)}}}
function securityPage(){$('#admin-content').innerHTML=`<div class="split"><div class="panel"><h3>修改后台密码</h3><form id="password-form"><label>原密码<input id="old-password" type="password" required autocomplete="current-password"></label><label>新密码（至少 8 位）<input id="new-password" type="password" minlength="8" maxlength="256" required autocomplete="new-password"></label><label>再次输入新密码<input id="new-confirm" type="password" required autocomplete="new-password"></label><button class="primary" style="margin-top:20px">修改密码并退出登录</button></form></div><div class="panel"><h3>备份与迁移</h3><p>点击“导出数据备份”，保存包含文章、媒体、设置及密码的 ZIP。备份不包含运行环境。</p><p>换电脑：先关闭启动博客的黑色窗口，再复制整个 PortableBlog 文件夹到另一台 Windows 10/11 64 位电脑，双击 启动博客.bat。</p><p>恢复数据备份：关闭博客，将备份中的 data 文件夹解压到博客根目录，替换前请先另行备份当前 data。若需精确恢复历史版本，先移走现有 data，再放入备份的 data。</p><p class="help">密码保护管理操作，但数据未加密。请保管好文件夹和备份；敏感资料建议放在加密磁盘中。</p><a href="/api/backup">下载数据备份 ZIP</a></div></div>`;$('#password-form').onsubmit=async e=>{e.preventDefault();if($('#new-password').value!==$('#new-confirm').value)return notice('两次新密码不一致');try{await api('password',{old:$('#old-password').value,password:$('#new-password').value});await refresh();adminEntry();notice('密码已修改，请重新登录')}catch(e){notice(e.message)}}}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});go('home').catch(e=>{$('#main').textContent='无法连接本地博客，请确认启动窗口仍在运行。';notice(e.message)});
</script></html>
